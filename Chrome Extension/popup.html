<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MWCA 设置</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
      border-radius: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #ED8833;
      text-align: center;
    }
    .icon-top {
      display: block;
      width: 80px;
      height: 80px;
      margin: 0 auto 10px;
      object-fit: contain;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .row:last-child { border-bottom: none; }
    .label {
      line-height: 1.4;
      white-space: nowrap;
    }
    /* 开关 */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: none;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider {
      background-color: #ED8833;
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
      line-height: 1.5;
      text-align: center;
    }
    /* GitHub 跳转按钮 */
    .github-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 12px;
      padding: 9px 0;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
      color: #333;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .github-btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <img class="icon-top" src="icons/icon128.png" alt="MWCA">

  <h1>MWCA 设置</h1>

  <div class="row">
    <div class="label">隐藏左侧栏</div>
    <label class="switch">
      <input type="checkbox" id="hideSidebar">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div class="label">隐藏发微博模块</div>
    <label class="switch">
      <input type="checkbox" id="hidePublishCard">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div class="label">使用锤子系统微博图标</div>
    <label class="switch">
      <input type="checkbox" id="useHammerLogo">
      <span class="slider"></span>
    </label>
  </div>

  <a class="github-btn" href="https://github.com/qiqikuka/MWCA-Make-Weibo-Clean-Again" target="_blank" rel="noopener noreferrer">GitHub</a>

  <div class="note">如设置未生效，请手动刷新微博页面</div>

  <script src="popup.js"></script>
</body>
</html>
